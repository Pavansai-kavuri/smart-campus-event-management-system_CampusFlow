<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- MANDATORY: Declare support for both light and dark themes -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const storedScheme = localStorage.getItem("color-scheme");
        const meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) {
          meta.content = storedScheme ?? "light dark";
        }
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isDark = storedScheme === "dark" || (!storedScheme && prefersDark);
        document.documentElement.classList.toggle("dark", isDark);
      } catch (e) {
        // Fallback if localStorage is blocked
      }
    </script>
    <title>CampusFlow — Smart Student Events</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <!-- Google Identity Services (GIS) Client SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-surface-bg text-content-primary font-sans antialiased selection:bg-champagne/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
